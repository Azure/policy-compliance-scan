name: "Run unit tests."
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build_test_job:
    name: 'Build and test job'
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
          os: [windows-latest, ubuntu-latest, macos-latest]
    steps:

    - name: 'Checking out repo code'
      uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0

    - name: 'Validate build'
      run: |
        npm install
        npm build
    - name: 'Run L0 tests'
      run: |
        npm run test
